name: Bug report
description: Report a reproducible defect in an implemented ARSY capability.
title: "[Bug] Short, factual description"
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, tokens, personal data, or unredacted customer payloads. Redact secrets from logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary and impact
      description: What is broken and who/what is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest deterministic sequence, including request paths or commands where safe.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ARSY commit/version, environment, OS, runtime/tool versions, provider adapter, and relevant non-sensitive configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or request IDs (redacted)
      description: Remove tokens, passwords, keys, database URLs, customer data, and sensitive headers. Prefer correlation/request IDs.
      render: text
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Proposed regression test
      description: What automated test would prevent this from returning?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I removed secrets, credentials, and sensitive customer data.
          required: true
        - label: I verified this behavior is implemented (not a planned capability).
          required: true
