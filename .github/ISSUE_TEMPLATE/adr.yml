name: Architecture decision
description: Propose or record an architecture decision
title: "[ADR] "
labels: ["architecture"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Considered options
    validations:
      required: true
  - type: textarea
