name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/dev-up.sh
          bash -n scripts/dev-down.sh
          bash -n scripts/bootstrap-backend.sh
      - name: Validate development Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/compose.dev.yaml config --quiet

  frontend:
    name: Lint, type-check, and build Next.js apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type-check
        working-directory: frontend
        run: pnpm typecheck
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend-template:
    name: Generate and validate Loco Control Plane template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Generate Loco application
        run: bash scripts/bootstrap-backend.sh
      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/apps/arsy-control-plane/Cargo.toml --all -- --check
      - name: Compile backend
        run: cargo check --manifest-path backend/apps/arsy-control-plane/Cargo.toml
