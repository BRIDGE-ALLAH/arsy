name: Generate Loco Control Plane (P0-02)

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-control-plane.sh
      - .github/workflows/p0-02-generate-loco.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: p0-02-loco-generation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.head_ref == 'p0-02-loco-generate'
    name: Generate and verify official Loco app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loco -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install the official Loco app generator
        run: cargo install loco --version 1.3.1 --locked

      - name: Generate the PostgreSQL JSON API and durable queue app
        run: bash scripts/generate-control-plane.sh

      - name: Generate dependency lockfile
        run: cargo generate-lockfile --manifest-path backend/apps/arsy-control-plane/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path backend/apps/arsy-control-plane/Cargo.toml --all -- --check

      - name: Compile the generated application
        run: cargo check --manifest-path backend/apps/arsy-control-plane/Cargo.toml --locked

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Run generated tests
        env:
          PGPASSWORD: loco
        run: |
          for db in arsy-control-plane_development arsy-control-plane_test; do
            createdb --host 127.0.0.1 --username loco "$db" || true
          done
          cargo test --manifest-path backend/apps/arsy-control-plane/Cargo.toml --locked

      - name: Commit generated application
        run: |
          git add backend/apps/arsy-control-plane
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(backend): generate Loco control plane app (P0-02)"
          git push origin HEAD:${{ github.head_ref }}
