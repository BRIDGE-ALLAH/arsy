name: Generate Loco Control Plane (P0-02)

on:
  push:
    branches:
      - p0-02-loco-app
    paths:
      - .github/workflows/p0-02-generate-loco.yml

permissions:
  contents: write

concurrency:
  group: p0-02-loco-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and verify official Loco app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loco -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install the official Loco app generator
        run: cargo install loco --version 1.3.1 --locked

      - name: Generate the PostgreSQL JSON API and durable queue app
        run: >-
          loco new
          --name arsy-control-plane
          --path backend/apps
          --db postgres
          --bg queue-postgres
          --assets none
          --allow-in-git-repo

      - name: Check formatting
        run: cargo fmt --manifest-path backend/apps/arsy-control-plane/Cargo.toml --all -- --check

      - name: Compile the generated application
        run: cargo check --manifest-path backend/apps/arsy-control-plane/Cargo.toml --locked

      - name: Compile and run generated tests
        env:
          PGPASSWORD: loco
        run: |
          for db in arsy_control_plane_development arsy_control_plane_test; do
            createdb --host 127.0.0.1 --username loco "$db" || true
          done
          cargo test --manifest-path backend/apps/arsy-control-plane/Cargo.toml --locked

      - name: Commit generated application
        run: |
          git add backend/apps/arsy-control-plane
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(backend): generate Loco control plane app (P0-02)"
          git push origin HEAD:p0-02-loco-app
